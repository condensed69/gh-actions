name: oc-review

on:
  workflow_call: {}

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      # v4 still declares Node 20 and prints a deprecation notice on
      # every run now that Actions runners default to Node 24
      # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
      # v5+ natively uses Node 24. Do not set
      # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION — that opts back into Node 20.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity & auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Install OpenCode directly instead of via the anomalyco/opencode action.
      # That action's "Get opencode version" step does an UNAUTHENTICATED curl to
      # api.github.com/repos/anomalyco/opencode/releases/latest, which trips the
      # 60/hr/IP rate limit on shared runner IPs and kills the run before any
      # model executes. Here we do an AUTHENTICATED call (5000/hr limit) instead.
      - name: Get OpenCode latest version
        id: opencode-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::Failed to resolve opencode version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache OpenCode
        id: cache-opencode
        uses: actions/cache@v4.3.0
        with:
          path: ~/.opencode
          key: ${{ runner.os }}-opencode-${{ steps.opencode-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-opencode-

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # `opencode github run` checks `git status --porcelain` after the model
      # finishes and, if anything shows, runs `git add .`, commits and pushes
      # to the PR branch -- and only then posts its comment. A review must
      # never change the branch, but the model can leave scratch files behind
      # (condensed69/mom-site#110 got probe5.mjs/probe6.mjs committed as
      # "Approve PR #110"). For a bare /oc review, ignore every untracked file
      # so the tree stays clean and nothing is committed. Set before opencode
      # checks out the PR branch; exclude rules don't affect that checkout.
      # This stops uncommitted scratch files only: an edit to a tracked file,
      # or a commit the model makes itself, is still pushed. The review
      # prompt below is what guards those, and it also survives opencode
      # changing how it stages (e.g. to `git add -f`).
      # "/oc <instruction>" runs are untouched: those may commit on purpose.
      #
      # This step is the one place that decides "bare /oc review". The
      # exclude and both PROMPTs read its output, so they can't drift apart
      # into "review prompt but free to commit". The body is trimmed and
      # lowercased first: the caller's trigger uses contains(), which is
      # case-insensitive, so "/oc\n" and "/OC" start a run too. A trailing
      # "---" + "_Generated by [Claude Code](...)_" footer is dropped first:
      # Claude Code's GitHub tooling appends it to every comment it posts, so
      # its "/oc" otherwise never counts as a bare review.
      - name: Detect a bare /oc review
        id: mode
        env:
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && 'true' || 'false' }}
          BODY: ${{ github.event.comment.body }}
        run: |
          footer=$'^(.*)\n[[:space:]]*---[[:space:]]*\n_Generated by \\[Claude Code\\]\\([^)]*\\)_[[:space:]]*$'
          if [[ "$BODY" =~ $footer ]]; then BODY="${BASH_REMATCH[1]}"; fi
          cmd="${BODY#"${BODY%%[![:space:]]*}"}"
          cmd="${cmd%"${cmd##*[![:space:]]}"}"
          cmd="${cmd,,}"
          review=false
          if [[ "$IS_PR_COMMENT" == true && ( "$cmd" == /oc || "$cmd" == /opencode ) ]]; then
            review=true
            printf '\n*\n' >> .git/info/exclude
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (primary — Zen free)
        id: opencode-primary
        run: opencode github run
        continue-on-error: true
        # big-pickle hit the old 15 min cap on Scent-Smart#19 (2026-10-08) and its
        # partial work was thrown away: the fallback starts over from scratch.
        timeout-minutes: 30
        env:
          # Proven on stripper-dance run 497 (2026-08-31): posted a full
          # review with no OpenCode Go quota. Do not use opencode-go/* while
          # Go tokens are exhausted. Do not use nemotron-*-free: NVIDIA's
          # trial endpoint 404s mid-stream after ~12 min
          # ("Upstream request failed: [404] Provider returned error").
          MODEL: opencode/big-pickle
          # A bare /oc makes opencode use its hardcoded "Summarize this thread"
          # prompt. Replace it with a review, but only for a bare /oc on a PR
          # conversation (steps.mode). "/oc <text>" and inline code-line
          # comments are unchanged.
          PROMPT: ${{ steps.mode.outputs.review == 'true' && 'Review this pull request. Look for bugs, security problems, and anything that should change before merging. Cite file and line for each finding. This is a review only, so do not create, edit, delete or commit any files in the repository; put any scratch scripts or notes under /tmp.' || '' }}
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: "/opencode,/oc"
          # Zen free models need no credential. Omitting OPENCODE_API_KEY
          # keeps this path from spending Go or paid Zen credits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A failed primary review can leave a tracked-file edit behind, which
      # the fallback would then commit and push. Reset it for review runs.
      - name: Discard the primary review's edits
        if: steps.opencode-primary.outcome != 'success' && steps.mode.outputs.review == 'true'
        run: git reset -q --hard

      - name: Run OpenCode (fallback — Zen free)
        if: steps.opencode-primary.outcome != 'success'
        run: opencode github run
        # 30, not 15, on purpose: on a Scent-Smart Aikido PR (2026-10-08) both
        # steps hit the 15 min cap and the run failed with no review. Keep it
        # equal to the primary's limit; this step starts a fresh review.
        timeout-minutes: 30
        env:
          # Different family from primary so a Spark outage does not take
          # both steps. Official Zen free, tool-calling, 200k ctx. Do not
          # use nemotron-*-free (NVIDIA 404) or hy3-free (catalog drop
          # 2026-08-30, "Model not found" on PR 145).
          MODEL: opencode/muse-spark-1.3-contributor-free
          # A bare /oc makes opencode use its hardcoded "Summarize this thread"
          # prompt. Replace it with a review, but only for a bare /oc on a PR
          # conversation (steps.mode). "/oc <text>" and inline code-line
          # comments are unchanged.
          PROMPT: ${{ steps.mode.outputs.review == 'true' && 'Review this pull request. Look for bugs, security problems, and anything that should change before merging. Cite file and line for each finding. This is a review only, so do not create, edit, delete or commit any files in the repository; put any scratch scripts or notes under /tmp.' || '' }}
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: "/opencode,/oc"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
