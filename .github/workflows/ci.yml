name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          status=0
          for script in add-oc-review.sh test-add-oc-review.sh; do
            bash -n "$script" || status=1
          done
          exit "$status"
      - run: bash test-add-oc-review.sh
      - run: python3 test-oc-review.py
