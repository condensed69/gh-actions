name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Workflow-level concurrency is evaluated BEFORE the job `if`, so every
# issue comment (Jules, bots, "lgtm") used to cancel an in-progress /oc
# review. Group is per-repo + PR so reviews run in parallel across PRs
# and repos. cancel-in-progress is only true for a real collaborator /oc
# on that same PR — a second /oc replaces the first; Jules does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ !github.event.comment.user.bot && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) }}

jobs:
  opencode:
    # Only same-repo collaborators (not bots, not forks) can trigger a review.
    # The !bot guard stops the review's own comment from re-triggering the run.
    if: |
      !github.event.comment.user.bot &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: condensed69/gh-actions/.github/workflows/oc-review.yml@main
    secrets: inherit
